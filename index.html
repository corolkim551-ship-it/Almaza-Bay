<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#071a31"><title>Winter Project | Operations Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><div class="mark">⌁</div><div><div class="brand-name">WINTER<br>PROJECT</div><div class="brand-sub">Maintenance & Manufacturing</div></div></div>
  <nav>
    <button class="nav active" data-page="dashboard"><span>⌂</span>Dashboard</button>
    <button class="nav" data-page="projects"><span>▣</span>Projects <b>10</b></button>
    <button class="nav" data-page="maintenance"><span>⌕</span>Maintenance</button>
    <button class="nav" data-page="reports"><span>▥</span>Reports</button>
    <button class="nav" data-page="hotels"><span>▤</span>Hotels <b>8</b></button>
    <button class="nav" data-page="departments"><span>♙</span>Departments</button>
    <button class="nav" data-page="settings"><span>⚙</span>Settings</button>
  </nav>
  <div class="side-footer"><div class="mountain">⌁⌁⌁</div><small>EXCELLENCE</small><strong>IN HOSPITALITY<br>OPERATIONS</strong><i></i></div>
</aside>

<main>
<header class="topbar">
  <div class="global-search">⌕<input id="globalSearch" placeholder="Search projects, departments, hotels..."></div>
  <div class="top-right"><button class="bell">♧<em></em></button><div class="line"></div><div class="user"><span>PA</span><div><strong>Project Admin</strong><small>Administrator</small></div>⌄</div><button id="theme" class="theme">☼</button></div>
</header>

<div id="page"></div>
</main>
</div>

<div id="modal" class="backdrop"><div class="modal"><button id="close" class="close">×</button><small class="gold-label">NEW RECORD</small><h2>Create Project</h2><p>Register a new operation, maintenance or hospitality task.</p>
<form id="form"><label>Project name<input id="name" required placeholder="e.g. Generator Inspection"></label>
<div class="two"><label>Department<select id="dept"></select></label><label>Hotel<select id="hotel"></select></label></div>
<div class="two"><label>Due date<input id="date" type="date" required></label><label>Priority<select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label></div>
<button class="primary wide">Create Project</button></form></div></div>

<script src="app.js"></script>
</body></html>
